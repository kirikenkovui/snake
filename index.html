<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>🐍 Snake Game</title>
        <!-- font import -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@1,700&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1 id="inst">Choose difficulty to start the game</h1>
        <div class="game-wrapper">
            <div id="dif-div" class="buttons-div">
                <button class="difficulty" data-speed="200" data-boost="0.8">
                    <span class="text">Slow</span>
                </button>
                <button class="difficulty" data-speed="100" data-boost="0.8">
                    <span class="text">Fast</span>
                </button>
                <button class="difficulty" data-speed="50" data-boost="0.8">
                    <span class="text">Very fast</span>
                </button>
                <button class="difficulty" data-speed="200" data-boost="0.6">
                    <span class="text">Turbo mode</span>
                </button>
                <label>(Speed increases faster)</label>
            </div>

            <div id="gameHeader" class="game-header" style="display: none;">
                <div class="score-display">
                    <div>Score: <span id="currentScore">0</span></div>
                    <div>High Score: <span id="highScoreDisplay">0</span></div>
                </div>
                <button id="pauseBtn" class="pause-btn">⏸ Pause</button>
            </div>

            <canvas
                id="gameCanvas"
                width="945"
                height="945"
                style="
                    display: none;
                    border: 2px solid black;
                    vertical-align: top;
                "
            >
            </canvas>

            <div id="pauseOverlay" class="pause-overlay" style="display: none;">
                <div class="pause-content">
                    <h2>Paused</h2>
                    <button id="resumeBtn" class="pause-action-btn">Resume</button>
                    <button id="backToMenuBtn" class="pause-action-btn">Back to Menu</button>
                </div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
