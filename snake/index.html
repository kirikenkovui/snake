<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>snake</title>
            <!--font import -->
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@1,700&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1 id="inst">Choose difficulty to start the game</h1>
        <div class="game-wrapper">
            <div id="dif-div" class="buttons-div">
                <button
                    class="difficulty"
                    onclick="setDifficulty(200, 0.8)"><div class="text">Slow</div></button>

                <button
                    class="difficulty"
                    onclick="setDifficulty(100, 0.8)"><div class="text">Fast</div></button>

                <button
                    class="difficulty"
                    onclick="setDifficulty(50, 0.8)"><div class="text">Very fast</div></button>

                <button
                    class="difficulty"
                    onclick="setDifficulty(200, 0.6)"><div class="text">Turbo mode</div></button>
                <label>(Speed increases faster)</label>
            </div>

            <div id="gameHeader" class="game-header" style="display: none;">
                <div class="score-display">
                    <div>Score: <span id="currentScore">0</span></div>
                    <div>High Score: <span id="highScoreDisplay">0</span></div>
                </div>
            </div>

            <canvas
                id="gameCanvas"
                width="945"
                height="945"
                style="
                    display: none;
                    border: 2px solid black;
                    vertical-align: top;
                "
            >
            </canvas>
        </div>

        <script src="script.js"></script>
    </body>
</html>
