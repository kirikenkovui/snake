<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>snake</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Choose difficulty to start game</h1>
        <div class="game-wrapper">
            <div class="buttons-div">
                <button onclick="startGameAsEasy()"
                    class="difficulty">Slow</button>

                <button
                    class="difficulty"
                    onclick="startGameAsMedium()">Fast</button>

                <button
                    class="difficulty"
                    onclick="startGameAsHard()">Very fast</button>

                <button
                    class="difficulty"
                    onclick="startGameAsTurbo()">Turbo mode</button>
                <label>(Speed increases faster)</label>
            </div>

            <canvas
                id="gameCanvas"
                width="630"
                height="630"
                style="
                    display: inline-block;
                    border: 2px solid black;
                    vertical-align: top;
                "
            >
            </canvas>
        </div>

        <script src="script.js"></script>
    </body>
</html>
