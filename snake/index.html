<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>snake</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div>
            <h1>Choose difficulty to start game</h1>

            <div style="display: inline-block; vertical-align: top">
                <button
                    class="difficulty"
                    style="
                        width: 200px;
                        height: 60px;
                        font-size: 24px;
                        padding: 10px 20px;
                    "
                >
                    Slow
                </button>

                <button
                    class="difficulty"
                    onclick="startGameAsMedium()"
                    style="
                        width: 200px;
                        height: 60px;
                        font-size: 24px;
                        padding: 10px 20px;
                    "
                >
                    Fast
                </button>

                <button
                    class="difficulty"
                    onclick="startGameAsHard()"
                    style="
                        width: 200px;
                        height: 60px;
                        font-size: 24px;
                        padding: 10px 20px;
                    "
                >
                    Very fast
                </button>

                <button
                    class="difficulty"
                    onclick="startGameAsTurbo()"
                    style="
                        width: 200px;
                        height: 60px;
                        font-size: 24px;
                        padding: 10px 20px;
                    "
                >
                    Turbo mode
                </button>
                <p>(Speed increases faster)</p>
            </div>

            <canvas
                id="gameCanvas"
                width="630"
                height="630"
                style="
                    display: inline-block;
                    border: 2px solid black;
                    vertical-align: top;
                "
            >
            </canvas>
        </div>

        <script src="script.js"></script>
    </body>
</html>
